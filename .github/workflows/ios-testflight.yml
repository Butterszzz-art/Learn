name: iOS → TestFlight

# Builds the iOS app on a GitHub-hosted Mac, signs it with Apple's
# cloud-managed certificates, and uploads it to App Store Connect, where it
# appears in TestFlight after Apple finishes processing (usually 5–30 min).
#
# Run it from the Actions tab → "iOS → TestFlight" → Run workflow.
# One-time setup (repo secrets) is described in docs/TESTFLIGHT.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version shown to testers (leave empty to keep the one in the Xcode project)"
        required: false
        default: ""

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  # Quick check on a cheap Linux runner: are the secrets valid, does the key
  # have the right role, do the bundle ID and app record exist? Fails with a
  # plain explanation before any Mac minutes are spent.
  apple-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Apple keys and setup
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: node scripts/asc-check.mjs

  testflight:
    needs: apple-setup
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Load trimmed Apple IDs
        env:
          RAW_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          RAW_KEY: ${{ secrets.ASC_KEY_ID }}
          RAW_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          echo "APPLE_TEAM_ID=$(printf '%s' "$RAW_TEAM" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "ASC_KEY_ID=$(printf '%s' "$RAW_KEY" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$(printf '%s' "$RAW_ISSUER" | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor into the iOS project
        run: npx cap sync ios

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          node scripts/asc-check.mjs "$RUNNER_TEMP/asc/AuthKey.p8" > /dev/null

      - name: Archive
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          BUILD_NUMBER=$(( ${{ github.run_number }} + 100 ))
          VERSION_ARG=""
          if [ -n "$VERSION_INPUT" ]; then
            if ! printf '%s' "$VERSION_INPUT" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$'; then
              echo "::error::Version must look like 1.0 or 1.0.1"; exit 1
            fi
            VERSION_ARG="MARKETING_VERSION=$VERSION_INPUT"
          fi
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            $VERSION_ARG
          echo "Built build number $BUILD_NUMBER" >> "$GITHUB_STEP_SUMMARY"

      - name: Export and upload to App Store Connect
        run: |
          sed "s/__TEAM_ID__/$APPLE_TEAM_ID/" ios/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded to App Store Connect. It shows up in TestFlight once Apple finishes processing." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
